<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Apple Property Lead Assistant</title>
    <link rel="stylesheet" href="demo/styles.css">
  </head>
  <body>
    <main class="chat-page">
      <section class="chat-shell" aria-label="Apple Property Lead Assistant">
        <header class="chat-header">
          <div class="assistant-avatar" aria-hidden="true">AP</div>
          <div class="assistant-title">
            <h1>Apple Property Lead Assistant</h1>
            <p>Listings, viewings, agent follow-up</p>
          </div>
          <span id="listingCount" class="listing-count">Loading</span>
        </header>

        <div id="conversation" class="chat-feed" aria-live="polite"></div>

        <div id="quickReplies" class="quick-replies" aria-label="Suggested replies"></div>

        <form id="askForm" class="composer">
          <input id="askInput" autocomplete="off" placeholder="Ask about rentals, buying, viewings, or Web Ref...">
          <button type="submit" aria-label="Send">Send</button>
        </form>

        <div id="assistantNote" class="status-line" role="status"></div>
      </section>
    </main>

    <script src="demo/app.js"></script>
  </body>
</html>
